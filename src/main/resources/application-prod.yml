spring:
  config:
    import: "classpath:/application-swagger.yml, classpath:/application-prod-oauth.yml"

  datasource:
    url: jdbc:h2:file:~/clipdb;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect

